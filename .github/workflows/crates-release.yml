name: Crates release

on:
  push:
    tags:
      - "foundation-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Resume publishing the release version from this ref
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crates-foundation-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  HOST_REF: 735c781ce886265b3cc2a2b92ea6ec0c0808b795
  SYSML_REF: cf7eea2be6aed7668e7cbbdc2f8c95100c3b5d1b

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mercurio-foundation
      - uses: actions/checkout@v4
        with:
          repository: mercurio-labs/mercurio-sysml
          ref: ${{ env.SYSML_REF }}
          path: mercurio-sysml
      - uses: actions/checkout@v4
        with:
          repository: mercurio-labs/mercurio-host-adapters
          ref: ${{ env.HOST_REF }}
          path: mercurio-host-adapters
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release identity
        working-directory: mercurio-foundation
        shell: bash
        run: |
          version="$(awk '/^\[workspace.package\]/{in_package=1; next} in_package && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"
          test -n "${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "foundation-v${version}"
          fi
      - name: Test workspace
        working-directory: mercurio-foundation
        run: cargo test --workspace --locked
      - name: Assemble crates.io packages
        working-directory: mercurio-foundation
        run: cargo package --workspace --no-verify --locked

  publish:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: qualify
    runs-on: ubuntu-latest
    environment: crates-io
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish packages in dependency order
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^\[workspace.package\]/{in_package=1; next} in_package && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"
          packages=(
            mercurio-kir
            mercurio-simulation-core
            mercurio-language-contracts
            mercurio-model
            mercurio-authoring
            mercurio-runtime
            mercurio-semantic-services
            mercurio-views
            mercurio-workspace
            mercurio-analysis
            mercurio-codegen
            mercurio-session
            mercurio-query-dsl
            mercurio-core
            mercurio-foundation
          )

          published() {
            curl --fail --silent --show-error \
              --header "User-Agent: mercurio-foundation-release/${version}" \
              "https://crates.io/api/v1/crates/$1" |
              jq --exit-status --arg version "${version}" \
                '.versions | any(.num == $version)' >/dev/null
          }

          publish_one() {
            local package="$1"
            if published "${package}"; then
              echo "${package} ${version} is already published"
              return
            fi

            for attempt in {1..15}; do
              if cargo publish --locked --package "${package}"; then
                return
              fi
              if published "${package}"; then
                return
              fi
              if [[ "${attempt}" -eq 15 ]]; then
                echo "failed to publish ${package} ${version}" >&2
                return 1
              fi
              echo "publish attempt ${attempt} failed; retrying ${package} in 60 seconds"
              sleep 60
            done
          }

          for package in "${packages[@]}"; do
            publish_one "${package}"
          done
